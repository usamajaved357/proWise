<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snag AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:280px;font-family:'Manrope',sans-serif;background:#0A0D16;color:#E7E9F0;overflow:hidden;border:0.5px solid #6366f1}

/* Header */
.hdr{position:relative;display:flex;align-items:center;gap:9px;padding:11px 12px 9px;border-bottom:1px solid #171B26}
.hdr-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(400px 120px at 0% 0%,rgba(45,212,191,.08),transparent 70%)}
.hdr-logo{position:relative;width:26px;height:26px;border-radius:22%;overflow:hidden;flex-shrink:0;background:#0D0A1A}
.hdr-logo-ring{position:absolute;left:50%;top:50%;width:78%;height:78%;transform:translate(-50%,-50%);border-radius:50%;-webkit-mask-image:radial-gradient(circle,transparent 50%,black 56%,black 82%,transparent 86%);mask-image:radial-gradient(circle,transparent 50%,black 56%,black 82%,transparent 86%);background:conic-gradient(from 200deg,#2dd4bf,#3b82f6 25%,#a855f7 55%,#ec4899 80%,#2dd4bf 100%)}
.hdr-logo-core{position:absolute;left:50%;top:50%;width:42%;height:42%;transform:translate(-50%,-50%);border-radius:50%;background:#000}
.hdr-logo.is-loading .hdr-logo-ring{animation:snagSpin 1.2s linear infinite}
@keyframes snagSpin{to{transform:rotate(360deg)}}
.hdr-name{position:relative;font-family:'Sora',sans-serif;font-size:13.5px;font-weight:700;color:#F5F6FA}
.hdr-sub{position:relative;font-size:10px;color:#7A8194;margin-top:1px}
.settings-btn{display:none}

.body-pad{padding:9px 10px 10px;display:flex;flex-direction:column;gap:9px}

/* Usage card */
.usage-card{position:relative;border-radius:10px;background:#0F1320;border:1px solid #1B2030;padding:9px 10px;overflow:hidden}
.usage-glow{position:absolute;top:-26px;right:-26px;width:90px;height:90px;border-radius:50%;filter:blur(18px);pointer-events:none}
.usage-top{position:relative;display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.plan-badge{display:flex;align-items:center;gap:4px;font-size:8.5px;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-radius:999px}
.plan-badge .dot{font-size:6px}
.usage-count{position:relative;display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.usage-count .num{font-family:'Sora',sans-serif;font-size:13px;font-weight:700;color:#F5F6FA}
.usage-count .of{font-size:10px;color:#565D70;font-weight:600}

.bar-wrap{position:relative;height:4px;border-radius:999px;background:#171B26;overflow:hidden;margin-bottom:6px}
.bar-fill{height:100%;border-radius:999px;transition:width .4s ease,background .3s}
.usage-status{position:relative;font-size:9.5px;color:#8B92A5;font-weight:600}
.usage-status.warn{color:#fbbf24}
.usage-status.danger{color:#fca5a5}

/* Audit callout */
.audit-banner{display:none;border-radius:9px;padding:8px 10px;align-items:flex-start;gap:7px}
.audit-banner .ic{flex-shrink:0;margin-top:1px}
.audit-banner .ic svg{width:13px;height:13px}
.audit-banner .txt{font-size:10px;line-height:1.5}
.audit-banner a{text-decoration:underline;font-weight:600}

/* Upgrade button — capsule gradient */
.upgrade-btn{display:none;width:100%;padding:9px 0;border:none;border-radius:999px;color:#fff;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;align-items:center;justify-content:center;gap:6px;background:linear-gradient(90deg,#2DD4BF,#A855F7,#EC4899);box-shadow:rgba(168,85,247,.55) 0 8px 18px -8px}
.upgrade-btn svg{width:13px;height:13px}

/* Dashboard & settings — capsule gradient */
.open-settings{width:100%;padding:9px 0;border:none;border-radius:999px;color:#fff;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(90deg,#2DD4BF,#A855F7);box-shadow:rgba(168,85,247,.45) 0 8px 18px -8px}
.open-settings svg{width:13px;height:13px}
.open-settings:hover,.upgrade-btn:hover{filter:brightness(1.06)}

.ftr{text-align:center;font-size:9px;color:#4B5164;padding:0 10px 10px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-glow"></div>
  <div class="hdr-logo" id="hdr-logo">
    <div class="hdr-logo-ring"></div>
    <div class="hdr-logo-core"></div>
  </div>
  <div>
    <div class="hdr-name">Snag AI</div>
    <div class="hdr-sub">Upwork proposal writer</div>
  </div>
  <!-- settings-btn kept for JS listener, visually hidden -->
  <button class="settings-btn" id="settings-btn" title="Open settings"></button>
</div>

<div class="body-pad">

  <!-- Usage Card -->
  <div class="usage-card">
    <div class="usage-glow" id="usage-glow"></div>
    <div class="usage-top">
      <div class="plan-badge" id="plan-badge"><span class="dot">◆</span><span id="plan-badge-label">FREE</span></div>
      <div class="usage-count"><span class="num" id="used-count">0</span><span class="of">/ <span id="limit-count">2</span> proposals</span></div>
    </div>
    <div class="bar-wrap"><div class="bar-fill" id="usage-bar" style="width:0%"></div></div>
    <div class="usage-status" id="usage-status">2 proposals remaining this month</div>
  </div>

  <!-- Audit callout — only shown when the plan lacks job/profile audits -->
  <div class="audit-banner" id="audit-banner">
    <span class="ic" id="audit-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 11V7.5C8 5.29 9.79 3.5 12 3.5C14.21 3.5 16 5.29 16 7.5V11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </span>
    <span class="txt"><span id="audit-msg"></span> <a href="#" id="audit-link"></a></span>
  </div>

  <!-- Upgrade button -->
  <button class="upgrade-btn" id="upgrade-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3L13.8 9.2L20 11L13.8 12.8L12 19L10.2 12.8L4 11L10.2 9.2L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    Upgrade Plan
  </button>

  <!-- Dashboard & settings -->
  <button class="open-settings" id="open-settings">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>
    Dashboard &amp; settings
  </button>

</div>

<div class="ftr">Snag AI v1.0.0 · Snag the job before anyone else</div>

<script type="module" src="popup.js"></script>
</body>
</html>
