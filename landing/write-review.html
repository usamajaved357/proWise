<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write a Review | Snag AI</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #07090f; }
  .star-btn { background: transparent; border: none; cursor: pointer; padding: 4px; }
  .star-btn svg { transition: transform 0.1s ease; }
  .star-btn:hover svg { transform: scale(1.12); }
  textarea:focus, input:focus { outline: none; border-color: rgba(168,85,247,0.5) !important; }
</style>
</head>
<body>

<div style="background: #07090f; color: #E7E9F0; font-family: 'Manrope', sans-serif; min-height: 100vh; display: flex; flex-direction: column;">

  <div style="position: fixed; inset: 0; pointer-events: none; z-index: 0; background:
    radial-gradient(900px 600px at 10% -5%, rgba(45,212,191,0.09), transparent 60%),
    radial-gradient(1000px 700px at 100% 10%, rgba(236,72,153,0.08), transparent 60%),
    radial-gradient(1100px 800px at 50% 60%, rgba(168,85,247,0.06), transparent 60%);"></div>

  <header style="position: relative; z-index: 2; padding: 20px 28px;">
    <a href="index.html" style="display: flex; align-items: center; gap: 6px; text-decoration: none; width: fit-content;">
      <div style="position: relative; width: 32px; height: 32px; flex-shrink: 0;">
        <div style="position: absolute; left: 50%; top: 50%; width: 64%; height: 64%; transform: translate(-50%,-50%); border-radius: 50%; background: conic-gradient(from 200deg, #2DD4BF, #3B82F6 25%, #A855F7 55%, #EC4899 80%, #2DD4BF 100%);"></div>
          <div style="position: absolute; inset: 25%; border-radius: 50%; background: #000;"></div>
      </div>
      <span style="font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; color: #F5F6FA;">Snag AI</span>
    </a>
  </header>

  <main style="position: relative; z-index: 2; flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div id="review-card" style="width: 100%; max-width: 460px; border-radius: 18px; background: #0B0E17; border: 1px solid #171B26; padding: 34px 30px; text-align: center;">
      <div style="font-size: 13px; color: #6B7284;">Loading…</div>
    </div>
  </main>

</div>

<script src="config.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const token  = params.get('token') || '';
  const email  = params.get('email') || '';
  const card   = document.getElementById('review-card');
  let selectedRating = 0;

  function renderError(message) {
    card.innerHTML = `
      <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(248,113,113,0.14); color: #F87171; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
      </div>
      <h1 style="font-family: 'Sora', sans-serif; font-size: 19px; font-weight: 700; color: #F5F6FA; margin: 0 0 8px;">Can't open this link</h1>
      <p style="font-size: 14px; color: #8B92A5; line-height: 1.6; margin: 0 0 20px;">${message}</p>
      <a href="index.html" style="display: inline-block; padding: 11px 24px; border-radius: 999px; background: linear-gradient(90deg, #2DD4BF, #A855F7); color: #fff; font-size: 13.5px; font-weight: 700; text-decoration: none;">Back to home</a>
    `;
  }

  function renderSuccess(message) {
    card.innerHTML = `
      <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(52,211,153,0.14); color: #34D399; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <h1 style="font-family: 'Sora', sans-serif; font-size: 19px; font-weight: 700; color: #F5F6FA; margin: 0 0 8px;">Thank you!</h1>
      <p style="font-size: 14px; color: #8B92A5; line-height: 1.6; margin: 0 0 20px;">${message}</p>
      <a href="index.html" style="display: inline-block; padding: 11px 24px; border-radius: 999px; background: linear-gradient(90deg, #2DD4BF, #A855F7); color: #fff; font-size: 13.5px; font-weight: 700; text-decoration: none;">Back to home</a>
    `;
  }

  function starSvg(filled) {
    return `<svg width="30" height="30" viewBox="0 0 24 24" fill="${filled ? '#F5B95E' : 'none'}" stroke="#F5B95E" stroke-width="1.4"><path d="M12 2.5L14.9 8.6L21.6 9.5L16.8 14.1L18 20.8L12 17.6L6 20.8L7.2 14.1L2.4 9.5L9.1 8.6L12 2.5Z"></path></svg>`;
  }

  function renderStars() {
    const row = document.getElementById('star-row');
    row.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'star-btn';
      btn.innerHTML = starSvg(i <= selectedRating);
      btn.onclick = () => { selectedRating = i; renderStars(); };
      row.appendChild(btn);
    }
  }

  function renderForm() {
    card.innerHTML = `
      <h1 style="font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 700; color: #F5F6FA; margin: 0 0 6px;">Write your review</h1>
      <p style="font-size: 13.5px; color: #8B92A5; margin: 0 0 22px;">Verified purchase &middot; ${email}</p>
      <div id="star-row" style="display: flex; justify-content: center; gap: 2px; margin-bottom: 18px;"></div>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input id="review-name" type="text" placeholder="Your name (e.g. Marcus T.)" style="flex: 1; min-width: 0; background: #10141F; border: 1px solid #1D2230; border-radius: 10px; padding: 12px 14px; color: #E7E9F0; font-family: 'Manrope', sans-serif; font-size: 13.5px;">
        <input id="review-title" type="text" placeholder="Role (e.g. Backend Engineer)" style="flex: 1; min-width: 0; background: #10141F; border: 1px solid #1D2230; border-radius: 10px; padding: 12px 14px; color: #E7E9F0; font-family: 'Manrope', sans-serif; font-size: 13.5px;">
      </div>
      <textarea id="review-text" placeholder="What's your experience with Snag AI been like?" style="width: 100%; min-height: 110px; resize: vertical; background: #10141F; border: 1px solid #1D2230; border-radius: 10px; padding: 12px 14px; color: #E7E9F0; font-family: 'Manrope', sans-serif; font-size: 13.5px; line-height: 1.6; margin-bottom: 8px;"></textarea>
      <div id="form-error" style="font-size: 12.5px; color: #F87171; text-align: left; margin-bottom: 8px; display: none;"></div>
      <button id="submit-btn" style="width: 100%; padding: 13px 0; border-radius: 999px; border: none; background: linear-gradient(90deg, #2DD4BF, #A855F7); color: #fff; font-size: 14px; font-weight: 700; font-family: 'Manrope', sans-serif; cursor: pointer; margin-top: 8px;">Submit review</button>
    `;
    renderStars();
    document.getElementById('submit-btn').onclick = submitReview;
  }

  async function submitReview() {
    const text  = document.getElementById('review-text').value.trim();
    const name  = document.getElementById('review-name').value.trim();
    const title = document.getElementById('review-title').value.trim();
    const errEl = document.getElementById('form-error');
    errEl.style.display = 'none';

    if (selectedRating < 1) { errEl.textContent = 'Pick a star rating.'; errEl.style.display = 'block'; return; }
    if (!name) { errEl.textContent = 'Enter your name.'; errEl.style.display = 'block'; return; }
    if (!title) { errEl.textContent = 'Enter your role or title.'; errEl.style.display = 'block'; return; }
    if (text.length < 10) { errEl.textContent = 'Write a few words about your experience.'; errEl.style.display = 'block'; return; }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Submitting…';

    try {
      const res  = await fetch(`${SNAG_API_URL}/reviews/submit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, token, rating: selectedRating, text, name, title })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong.');
      renderSuccess(data.message || 'Your review is in for approval.');
    } catch(e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Submit review';
    }
  }

  (async function init() {
    if (!token || !email) {
      renderError('This link is missing information. Request a new one from the homepage.');
      return;
    }
    try {
      const res  = await fetch(`${SNAG_API_URL}/reviews/invite/check?token=${encodeURIComponent(token)}&email=${encodeURIComponent(email)}`);
      const data = await res.json();
      if (data.ok) renderForm();
      else renderError(data.error || 'This link is invalid or has expired.');
    } catch(e) {
      renderError('Could not reach the server. Try again in a moment.');
    }
  })();
</script>

</body>
</html>
