<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Snag AI</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; }
body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
#state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 60px 20px; color: rgba(240,238,234,.5); font-size: 13px; }
.spinner { width: 26px; height: 26px; border: 2.5px solid rgba(255,255,255,.12); border-top-color: #A855F7; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#error { display: none; padding: 40px 20px; text-align: center; color: rgba(240,238,234,.6); font-size: 13px; line-height: 1.6; }
.paddle-checkout-frame { width: 100%; }
</style>
</head>
<body>

<div id="state"><div class="spinner"></div>Loading checkout…</div>
<div id="error">Something went wrong loading checkout. Please close this and try again.</div>
<div class="paddle-checkout-frame"></div>

<script src="config.js"></script>
<script>
  const PRICE_IDS = {
    starter: '__PADDLE_PRICE_STARTER__',
    pro:     '__PADDLE_PRICE_PRO__',
    agency:  '__PADDLE_PRICE_AGENCY__'
  };

  const params = new URLSearchParams(window.location.search);
  const plan   = params.get('plan') || 'pro';
  const email  = params.get('email') || undefined;
  const priceId = PRICE_IDS[plan];

  function postToParent(payload) {
    try { window.parent.postMessage(Object.assign({ source: 'snagai-checkout' }, payload), '*'); } catch (e) {}
  }

  if (!priceId) {
    document.getElementById('state').style.display = 'none';
    document.getElementById('error').style.display = 'block';
  } else {
    Paddle.Environment.set('__PADDLE_ENVIRONMENT__');
    Paddle.Initialize({
      token: '__PADDLE_CLIENT_TOKEN__',
      eventCallback: function(data) {
        if (data.name === 'checkout.loaded') {
          document.getElementById('state').style.display = 'none';
        }
        if (data.name === 'checkout.completed') {
          postToParent({ event: 'checkout.completed' });
        }
        if (data.name === 'checkout.closed') {
          postToParent({ event: 'checkout.closed' });
        }
      }
    });

    const checkoutSettings = {
      items: [{ priceId: priceId, quantity: 1 }],
      settings: {
        displayMode: 'inline',
        frameTarget: 'paddle-checkout-frame',
        frameInitialHeight: '450',
        frameStyle: 'width:100%;min-width:286px;background-color:transparent;border:none;',
        theme: 'dark',
        locale: 'en'
      }
    };
    if (email) checkoutSettings.customer = { email: email };

    Paddle.Checkout.open(checkoutSettings);
  }
</script>
</body>
</html>
